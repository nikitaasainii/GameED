<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameEd — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d2b5e;
    --coral: #ff6b4a;
    --coral-dark: #e8502e;
    --coral-light: rgba(255,107,74,0.15);
    --text: #ffffff;
    --text-soft: rgba(255,255,255,0.6);
    --border: rgba(255,255,255,0.15);
    --input-bg: rgba(255,255,255,0.08);
    --card: rgba(255,255,255,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .blob { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; z-index:0; }
  .blob-1 { width:500px; height:500px; background:rgba(30,80,180,0.35); top:-150px; left:-150px; }
  .blob-2 { width:450px; height:450px; background:rgba(10,50,140,0.4); bottom:-100px; right:-100px; }

  .bubbles { position:fixed; inset:0; z-index:1; pointer-events:none; }
  .bub { position:absolute; border-radius:50%; border:1.5px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.02); animation:floatup linear infinite; }
  @keyframes floatup { 0%{transform:translateY(100vh);opacity:0;} 10%{opacity:1;} 90%{opacity:0.3;} 100%{transform:translateY(-80px);opacity:0;} }

  .wave-svg { position:fixed; bottom:0; left:0; width:100%; height:100px; z-index:1; pointer-events:none; }

  .screen {
    position:relative; z-index:10;
    display:flex; align-items:center; justify-content:center;
    gap:70px; width:min(1100px,95vw); padding:40px 20px;
  }

  /* Donna side */
  .donna-side {
    display:flex; flex-direction:column; align-items:center; flex-shrink:0;
    animation:slideLeft 0.9s cubic-bezier(0.34,1.4,0.64,1) forwards;
  }
  @keyframes slideLeft { from{opacity:0;transform:translateX(-40px);} to{opacity:1;transform:translateX(0);} }

  .donna-wrap { position:relative; width:280px; height:280px; display:flex; align-items:center; justify-content:center; overflow:visible; }
  .donna-ring { position:absolute; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,rgba(255,140,60,0.15) 0%,transparent 70%); animation:pulse-ring 3.5s ease-in-out infinite; }
  @keyframes pulse-ring { 0%,100%{transform:scale(1);opacity:0.5;} 50%{transform:scale(1.07);opacity:0.9;} }

  .donna-svg { width:240px; height:240px; animation:donna-bob 4s ease-in-out infinite; filter:drop-shadow(0 16px 36px rgba(220,140,60,0.35)); position:relative; z-index:2; }
  @keyframes donna-bob { 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-14px) rotate(2deg);} }

  .speech { position:absolute; top:28px; left:-148px; background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.2); border-radius:20px 20px 4px 20px; padding:10px 18px; box-shadow:0 4px 18px rgba(0,0,0,0.2); backdrop-filter:blur(10px); white-space:nowrap; z-index:5; }
  .speech p { font-size:14px; font-weight:700; color:#ffffff; }

  /* Form card */
  .form-card {
    width:min(420px,90vw);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:36px 36px 28px;
    backdrop-filter:blur(12px);
    animation:slideRight 0.9s cubic-bezier(0.34,1.4,0.64,1) forwards;
  }
  @keyframes slideRight { from{opacity:0;transform:translateX(40px);} to{opacity:1;transform:translateX(0);} }

  /* Tab toggle */
  .tabs { display:flex; background:rgba(255,255,255,0.07); border-radius:12px; padding:4px; margin-bottom:28px; }
  .tab {
    flex:1; padding:10px; border:none; border-radius:9px; cursor:pointer;
    font-family:'Nunito',sans-serif; font-size:14px; font-weight:800;
    transition:all 0.2s ease; background:transparent; color:var(--text-soft);
  }
  .tab.active { background:var(--coral); color:white; box-shadow:0 4px 12px rgba(255,107,74,0.35); }

  .form-title { font-family:'Fredoka One',cursive; font-size:28px; color:var(--text); margin-bottom:6px; }
  .form-subtitle { font-size:13px; color:var(--text-soft); margin-bottom:24px; }

  .field { margin-bottom:16px; }
  .field label { display:block; font-size:12px; font-weight:800; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:7px; }
  .field input {
    width:100%; padding:14px 16px; border-radius:12px;
    background:var(--input-bg); border:1.5px solid var(--border);
    color:var(--text); font-family:'Nunito',sans-serif; font-size:15px; font-weight:600;
    outline:none; transition:border-color 0.2s ease, background 0.2s ease;
  }
  .field input::placeholder { color:rgba(255,255,255,0.3); }
  .field input:focus { border-color:var(--coral); background:rgba(255,107,74,0.08); }

  .btn-submit {
    width:100%; padding:16px; border-radius:14px; border:none;
    background:var(--coral); color:white;
    font-family:'Nunito',sans-serif; font-size:16px; font-weight:900;
    cursor:pointer; margin-top:8px;
    box-shadow:0 6px 20px rgba(255,107,74,0.4);
    transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease;
  }
  .btn-submit:hover { transform:translateY(-3px); box-shadow:0 12px 32px rgba(255,107,74,0.55); background:var(--coral-dark); }
  .btn-submit:active { transform:scale(0.97); }

  .divider { display:flex; align-items:center; gap:12px; margin:18px 0; }
  .divider-line { flex:1; height:1px; background:var(--border); }
  .divider-text { font-size:12px; color:var(--text-soft); }

  .terms { font-size:11px; color:var(--text-soft); text-align:center; line-height:1.6; margin-top:16px; }
  .terms a { color:#ff8c6b; text-decoration:none; font-weight:700; }

  /* Hidden panels */
  .panel { display:none; }
  .panel.active { display:block; }

  .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(255,255,255,0.12); border:1.5px solid rgba(255,107,74,0.4); border-radius:50px; padding:12px 24px; font-family:'Nunito',sans-serif; font-weight:700; font-size:14px; color:#ffffff; box-shadow:0 8px 32px rgba(0,0,0,0.3); z-index:999; opacity:0; transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1); white-space:nowrap; backdrop-filter:blur(12px); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="bubbles" id="bubbles"></div>
<svg class="wave-svg" viewBox="0 0 1440 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0,60 C240,100 480,20 720,60 C960,100 1200,20 1440,60 L1440,100 L0,100 Z" fill="rgba(255,255,255,0.03)"/>
</svg>

<div class="screen">
  <!-- Donna -->
  <div class="donna-side">
    <div class="donna-wrap">
      <div class="donna-ring"></div>
      <div class="speech"><p>Hi! I'm <span style="color:#ff8c6b;">Donna!</span></p></div>
      <svg class="donna-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bodyG" cx="42%" cy="38%" r="62%">
            <stop offset="0%" stop-color="#fde87a"/><stop offset="35%" stop-color="#f9c13a"/>
            <stop offset="70%" stop-color="#f0920e"/><stop offset="100%" stop-color="#d4720a"/>
          </radialGradient>
          <radialGradient id="blushG" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f07040" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#f07040" stop-opacity="0"/>
          </radialGradient>
          <filter id="soft3"><feGaussianBlur stdDeviation="3"/></filter>
          <filter id="soft5"><feGaussianBlur stdDeviation="5"/></filter>
        </defs>
        <path d="M110 12 C116 30 120 48 126 60 C140 56 158 50 174 60 C180 66 170 80 160 90 C168 100 178 114 172 128 C166 140 150 134 138 128 C134 144 128 164 118 172 C108 178 102 160 110 146 C98 160 92 178 82 172 C72 166 66 146 62 128 C50 134 34 140 28 128 C22 114 32 100 40 90 C30 80 20 66 26 60 C42 50 60 56 74 60 C80 48 104 30 110 12Z" fill="#c86808" opacity="0.15" transform="translate(3,5)" filter="url(#soft5)"/>
        <path d="M110 12 C116 30 120 48 126 60 C140 56 158 50 174 60 C180 66 170 80 160 90 C168 100 178 114 172 128 C166 140 150 134 138 128 C134 144 128 164 118 172 C108 178 102 160 110 146 C98 160 92 178 82 172 C72 166 66 146 62 128 C50 134 34 140 28 128 C22 114 32 100 40 90 C30 80 20 66 26 60 C42 50 60 56 74 60 C80 48 104 30 110 12Z" fill="url(#bodyG)" stroke="#c86808" stroke-width="2.5" stroke-linejoin="round"/>
        <ellipse cx="106" cy="88" rx="32" ry="28" fill="#fef0a0" opacity="0.28" filter="url(#soft3)"/>
        <ellipse cx="110" cy="34" rx="4" ry="11" fill="white" opacity="0.3"/>
        <ellipse cx="110" cy="34" rx="3.5" ry="9" fill="white" opacity="0.25" transform="rotate(72 110 110)"/>
        <ellipse cx="110" cy="34" rx="3.5" ry="9" fill="white" opacity="0.25" transform="rotate(144 110 110)"/>
        <ellipse cx="110" cy="34" rx="3.5" ry="9" fill="white" opacity="0.25" transform="rotate(216 110 110)"/>
        <ellipse cx="110" cy="34" rx="4" ry="10" fill="white" opacity="0.28" transform="rotate(288 110 110)"/>
        <ellipse cx="88" cy="112" rx="12" ry="8" fill="url(#blushG)" filter="url(#soft3)"/>
        <ellipse cx="132" cy="112" rx="12" ry="8" fill="url(#blushG)" filter="url(#soft3)"/>
        <path d="M91 96 Q99 88 107 96" stroke="#3a2010" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M113 96 Q121 88 129 96" stroke="#3a2010" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M100 110 Q110 120 120 110" stroke="#3a2010" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- Form card -->
  <div class="form-card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('signup')">Create Account</button>
    </div>

    <!-- Login panel -->
    <div class="panel active" id="panel-login">
      <div class="form-title">Welcome back!</div>
      <div class="form-subtitle">Login to continue your ocean adventure</div>
      <div class="field"><label>Email</label><input type="email" placeholder="parent@email.com"/></div>
      <div class="field"><label>Password</label><input type="password" placeholder="Enter your password"/></div>
      <button class="btn-submit" onclick="showToast('Logging you in...')">Login</button>
    </div>

    <!-- Signup panel -->
    <div class="panel" id="panel-signup">
      <div class="form-title">Join GameEd!</div>
      <div class="form-subtitle">Create an account to get started</div>
      <div class="field"><label>Parent Name</label><input type="text" placeholder="Your full name"/></div>
      <div class="field"><label>Email</label><input type="email" placeholder="parent@email.com"/></div>
      <div class="field"><label>Password</label><input type="password" placeholder="Create a password"/></div>
      <button class="btn-submit" onclick="showToast('Creating your account...')">Create Account</button>
    </div>

    <p class="terms">By continuing you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></p>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
  const bc=document.getElementById('bubbles');
  for(let i=0;i<16;i++){const b=document.createElement('div');b.className='bub';const s=Math.random()*18+8;b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*14+10}s;animation-delay:${Math.random()*14}s;`;bc.appendChild(b);}

  function switchTab(tab){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('panel-'+tab).classList.add('active');
  }
  function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body>
</html>
