<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameEd — Home</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d2b5e; --coral:#ff6b4a; --coral-dark:#e8502e; --text:#ffffff; --text-soft:rgba(255,255,255,0.6); --border:rgba(255,255,255,0.12); --card:rgba(255,255,255,0.07); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); min-height:100vh; overflow:hidden; }
  .blob { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; z-index:0; }
  .blob-1 { width:500px; height:500px; background:rgba(30,80,180,0.3); top:-150px; left:-150px; }
  .blob-2 { width:450px; height:450px; background:rgba(10,50,140,0.35); bottom:-100px; right:-100px; }
  .bubbles { position:fixed; inset:0; z-index:1; pointer-events:none; }
  .bub { position:absolute; border-radius:50%; border:1.5px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.02); animation:floatup linear infinite; }
  @keyframes floatup { 0%{transform:translateY(100vh);opacity:0;} 10%{opacity:1;} 90%{opacity:0.3;} 100%{transform:translateY(-80px);opacity:0;} }
  .wave-svg { position:fixed; bottom:0; left:0; width:100%; height:100px; z-index:1; pointer-events:none; }
  .nav { position:relative; z-index:10; display:flex; align-items:center; justify-content:space-between; padding:20px 40px; }
  .nav-logo { font-family:'Fredoka One',cursive; font-size:26px; color:var(--text); }
  .nav-logo span { color:var(--coral); }
  .nav-right { display:flex; align-items:center; gap:16px; }
  .shells-pill { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.08); border:1px solid var(--border); border-radius:50px; padding:8px 16px; }
  .shells-pill span { font-size:14px; font-weight:800; color:var(--text); }
  .shells-pill .shell-count { color:var(--coral); }
  .settings-btn { width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,0.08); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s ease; color:var(--text); font-size:18px; }
  .settings-btn:hover { background:rgba(255,107,74,0.2); border-color:var(--coral); }
  .main { position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; padding:10px 40px 40px; }
  .donna-top { display:flex; align-items:center; gap:20px; margin-bottom:36px; animation:fadeDown 0.8s ease forwards; }
  @keyframes fadeDown { from{opacity:0;transform:translateY(-20px);} to{opacity:1;transform:translateY(0);} }
  .donna-mini { width:80px; height:80px; filter:drop-shadow(0 6px 16px rgba(220,140,60,0.4)); animation:bob 4s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  .greeting-sub { font-size:13px; color:var(--text-soft); font-weight:600; }
  .greeting-main { font-family:'Fredoka One',cursive; font-size:28px; color:var(--text); }
  .greeting-main span { color:var(--coral); }
  .zones-label { font-size:12px; font-weight:800; color:var(--text-soft); letter-spacing:2px; text-transform:uppercase; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; width:min(600px,90vw); }
  .zone-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:24px 22px; cursor:pointer; position:relative; overflow:hidden; transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease; animation:fadeUp 0.6s ease both; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
  .zone-card:nth-child(1){animation-delay:0.2s;} .zone-card:nth-child(2){animation-delay:0.3s;} .zone-card:nth-child(3){animation-delay:0.4s;} .zone-card:nth-child(4){animation-delay:0.5s;}
  .zone-card:hover { transform:translateY(-6px); box-shadow:0 16px 40px rgba(0,0,0,0.3); }
  .zone-card:active { transform:scale(0.97); }
  .zone-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:20px 20px 0 0; }
  .zone-english::before { background:linear-gradient(90deg,#ff6b4a,#ff8c6b); }
  .zone-math::before { background:linear-gradient(90deg,#4a90ff,#70b0ff); }
  .zone-gk::before { background:linear-gradient(90deg,#00c9b1,#4eddcc); }
  .zone-art::before { background:linear-gradient(90deg,#c96bff,#e0a0ff); }
  .zone-icon { font-size:32px; font-family:'Fredoka One',cursive; color:rgba(255,255,255,0.3); margin-bottom:10px; display:block; }
  .zone-name { font-family:'Fredoka One',cursive; font-size:20px; color:var(--text); display:block; margin-bottom:3px; }
  .zone-game { font-size:12px; color:var(--text-soft); font-weight:600; }
  .zone-arrow { position:absolute; bottom:18px; right:18px; width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.08); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--text-soft); transition:all 0.2s ease; }
  .zone-card:hover .zone-arrow { background:var(--coral); border-color:var(--coral); color:white; }
  .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(255,255,255,0.12); border:1.5px solid rgba(255,107,74,0.4); border-radius:50px; padding:12px 24px; font-family:'Nunito',sans-serif; font-weight:700; font-size:14px; color:#ffffff; box-shadow:0 8px 32px rgba(0,0,0,0.3); z-index:999; opacity:0; transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1); white-space:nowrap; backdrop-filter:blur(12px); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="blob blob-1"></div><div class="blob blob-2"></div>
<div class="bubbles" id="bubbles"></div>
<svg class="wave-svg" viewBox="0 0 1440 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0,60 C240,100 480,20 720,60 C960,100 1200,20 1440,60 L1440,100 L0,100 Z" fill="rgba(255,255,255,0.03)"/>
</svg>

<div class="nav">
  <div class="nav-logo">Game<span>Ed</span></div>
  <div class="nav-right">
    <div class="shells-pill"><span>Shells</span><span class="shell-count">3 / 10</span></div>
    <div class="settings-btn" onclick="showToast('Opening settings...')">&#9881;</div>
  </div>
</div>

<div class="main">
  <div class="donna-top">
    <svg class="donna-mini" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bodyG" cx="42%" cy="38%" r="62%"><stop offset="0%" stop-color="#fde87a"/><stop offset="35%" stop-color="#f9c13a"/><stop offset="70%" stop-color="#f0920e"/><stop offset="100%" stop-color="#d4720a"/></radialGradient>
        <radialGradient id="blushG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f07040" stop-opacity="0.5"/><stop offset="100%" stop-color="#f07040" stop-opacity="0"/></radialGradient>
        <filter id="s3"><feGaussianBlur stdDeviation="3"/></filter>
        <filter id="s5"><feGaussianBlur stdDeviation="5"/></filter>
      </defs>
      <path d="M110 12 C116 30 120 48 126 60 C140 56 158 50 174 60 C180 66 170 80 160 90 C168 100 178 114 172 128 C166 140 150 134 138 128 C134 144 128 164 118 172 C108 178 102 160 110 146 C98 160 92 178 82 172 C72 166 66 146 62 128 C50 134 34 140 28 128 C22 114 32 100 40 90 C30 80 20 66 26 60 C42 50 60 56 74 60 C80 48 104 30 110 12Z" fill="#c86808" opacity="0.15" transform="translate(3,5)" filter="url(#s5)"/>
      <path d="M110 12 C116 30 120 48 126 60 C140 56 158 50 174 60 C180 66 170 80 160 90 C168 100 178 114 172 128 C166 140 150 134 138 128 C134 144 128 164 118 172 C108 178 102 160 110 146 C98 160 92 178 82 172 C72 166 66 146 62 128 C50 134 34 140 28 128 C22 114 32 100 40 90 C30 80 20 66 26 60 C42 50 60 56 74 60 C80 48 104 30 110 12Z" fill="url(#bodyG)" stroke="#c86808" stroke-width="2.5"/>
      <ellipse cx="106" cy="88" rx="32" ry="28" fill="#fef0a0" opacity="0.28" filter="url(#s3)"/>
      <ellipse cx="88" cy="112" rx="12" ry="8" fill="url(#blushG)" filter="url(#s3)"/>
      <ellipse cx="132" cy="112" rx="12" ry="8" fill="url(#blushG)" filter="url(#s3)"/>
      <path d="M91 96 Q99 88 107 96" stroke="#3a2010" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M113 96 Q121 88 129 96" stroke="#3a2010" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M100 110 Q110 120 120 110" stroke="#3a2010" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="greeting">
      <div class="greeting-sub">Ready to explore?</div>
      <div class="greeting-main">Choose your <span>Zone!</span></div>
    </div>
  </div>

  <div class="zones-label">Ocean Zones</div>

  <div class="grid">
    <div class="zone-card zone-english" onclick="showToast('Swimming to English Cove...')">
      <span class="zone-icon">A</span>
      <span class="zone-name">English Cove</span>
      <span class="zone-game">Bubble Letters</span>
      <div class="zone-arrow">&#8594;</div>
    </div>
    <div class="zone-card zone-math" onclick="showToast('Swimming to Math Lagoon...')">
      <span class="zone-icon">1+1</span>
      <span class="zone-name">Math Lagoon</span>
      <span class="zone-game">Count the Fish</span>
      <div class="zone-arrow">&#8594;</div>
    </div>
    <div class="zone-card zone-gk" onclick="showToast('Swimming to GK Shipwreck...')">
      <span class="zone-icon">&#9788;</span>
      <span class="zone-name">GK Shipwreck</span>
      <span class="zone-game">Weather Watch</span>
      <div class="zone-arrow">&#8594;</div>
    </div>
    <div class="zone-card zone-art" onclick="showToast('Swimming to Art Grotto...')">
      <span class="zone-icon">&#9733;</span>
      <span class="zone-name">Art Grotto</span>
      <span class="zone-game">Color the Reef</span>
      <div class="zone-arrow">&#8594;</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
  const bc=document.getElementById('bubbles');
  for(let i=0;i<16;i++){const b=document.createElement('div');b.className='bub';const s=Math.random()*18+8;b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*14+10}s;animation-delay:${Math.random()*14}s;`;bc.appendChild(b);}
  function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body>
</html>
